# llms.ink for DeepSeek Harness, generated by the llms.ink sync script. Tools appear as mcp__llms-ink__<tool>.
# Set LLMS_INK_KEY before starting dsh to send your key as a Bearer token.
- insert:
    - id: llms-ink
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: llms-ink
        transport: streamable-http
        url: https://llms.ink/mcp
        headers: !!js "process.env.LLMS_INK_KEY?.trim() ? { Authorization: 'Bearer ' + process.env.LLMS_INK_KEY.trim() } : {}"
